version: '3.8'

services:
  # ========================================
  # MongoDB Database Service (Development)
  # ========================================
  mongodb:
    image: mongo:7.0
    container_name: iconic-crm-mongodb-dev
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
      MONGO_INITDB_DATABASE: iconic-crm-dev
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data_dev:/data/db
    networks:
      - crm-network-dev

  # ========================================
  # CRM Backend API Service (Development)
  # ========================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: iconic-crm-backend-dev
    restart: unless-stopped
    environment:
      - NODE_ENV=development
      - PORT=5000
      - MONGO_URI=mongodb://admin:admin123@mongodb:27017/iconic-crm-dev?authSource=admin
      - JWT_SECRET=dev-secret-key
      - JWT_EXPIRE=7d
      - FRONTEND_URL=http://localhost:3000
    ports:
      - "5000:5000"
    volumes:
      # Mount source code for hot-reload
      - .:/app
      - /app/node_modules
      - ./uploads:/app/uploads
      - ./logs:/app/logs
    depends_on:
      - mongodb
    networks:
      - crm-network-dev
    command: npm run dev

  # ========================================
  # MongoDB Admin Interface
  # ========================================
  mongo-express:
    image: mongo-express:latest
    container_name: iconic-crm-mongo-express-dev
    restart: unless-stopped
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: admin123
      ME_CONFIG_MONGODB_URL: mongodb://admin:admin123@mongodb:27017/
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: admin123
    ports:
      - "8081:8081"
    depends_on:
      - mongodb
    networks:
      - crm-network-dev

volumes:
  mongodb_data_dev:
    driver: local

networks:
  crm-network-dev:
    driver: bridge
