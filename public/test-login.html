<!DOCTYPE html>
<html>
<head>
    <title>Login Test</title>
</head>
<body>
    <h1>Quick Login Test</h1>
    <button onclick="testLogin()">Test Login</button>
    <div id="result"></div>

    <script>
        async function testLogin() {
            const result = document.getElementById('result');
            result.innerHTML = 'Testing...';
            
            try {
                const response = await fetch('http://localhost:7000/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        email: 'admin@iconic-crm.com',
                        password: 'admin123'
                    })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    result.innerHTML = `
                        <h2 style="color: green;">✅ Login Successful!</h2>
                        <p>Token: ${data.token ? 'Received' : 'Not received'}</p>
                        <p>User: ${data.user.name}</p>
                        <p>Role: ${data.user.role}</p>
                    `;
                    localStorage.setItem('authToken', data.token);
                } else {
                    result.innerHTML = `<h2 style="color: red;">❌ Login Failed</h2><p>${data.message}</p>`;
                }
            } catch (error) {
                result.innerHTML = `<h2 style="color: red;">❌ Error</h2><p>${error.message}</p>`;
                console.error('Full error:', error);
            }
        }
    </script>
</body>
</html>
