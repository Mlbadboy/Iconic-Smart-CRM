<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auth Diagnostic</title>
    <style>
        body {
            font-family: monospace;
            padding: 2rem;
            background: #1a1a1a;
            color: #0f0;
        }
        .result {
            background: #2a2a2a;
            padding: 1rem;
            margin: 1rem 0;
            border-left: 3px solid #0f0;
        }
        .error {
            border-left-color: #f00;
            color: #f00;
        }
        button {
            background: #0f0;
            color: #000;
            border: none;
            padding: 0.5rem 1rem;
            cursor: pointer;
            margin: 0.5rem;
        }
    </style>
</head>
<body>
    <h1>🔍 Auth Diagnostic Tool</h1>
    
    <div>
        <button onclick="checkToken()">Check Token</button>
        <button onclick="testLogin()">Test Login</button>
        <button onclick="testVerify()">Test Verify</button>
        <button onclick="clearAll()">Clear Storage</button>
    </div>

    <div id="results"></div>

    <script>
        const API_URL = 'http://localhost:7000/api';

        function log(message, isError = false) {
            const div = document.createElement('div');
            div.className = isError ? 'result error' : 'result';
            div.textContent = message;
            document.getElementById('results').appendChild(div);
        }

        function checkToken() {
            document.getElementById('results').innerHTML = '';
            const token = localStorage.getItem('authToken');
            const userName = localStorage.getItem('userName');
            const userRole = localStorage.getItem('userRole');
            
            log('=== LOCAL STORAGE ===');
            log(`Token: ${token ? token.substring(0, 50) + '...' : 'NOT FOUND'}`);
            log(`User Name: ${userName || 'NOT FOUND'}`);
            log(`User Role: ${userRole || 'NOT FOUND'}`);
        }

        async function testLogin() {
            document.getElementById('results').innerHTML = '';
            log('=== TESTING LOGIN ===');
            
            try {
                const response = await fetch(`${API_URL}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: 'admin@charlieai.com',
                        password: 'admin123'
                    })
                });

                log(`Status: ${response.status}`);
                const data = await response.json();
                
                if (response.ok && data.token) {
                    log('✅ Login successful!');
                    log(`Token: ${data.token.substring(0, 50)}...`);
                    log(`User: ${data.user.name} (${data.user.role})`);
                    
                    localStorage.setItem('authToken', data.token);
                    localStorage.setItem('userName', data.user.name);
                    localStorage.setItem('userRole', data.user.role);
                    
                    log('✅ Token saved to localStorage');
                } else {
                    log(`❌ Login failed: ${data.message || 'Unknown error'}`, true);
                }
            } catch (error) {
                log(`❌ Error: ${error.message}`, true);
            }
        }

        async function testVerify() {
            document.getElementById('results').innerHTML = '';
            log('=== TESTING VERIFY ===');
            
            const token = localStorage.getItem('authToken');
            if (!token) {
                log('❌ No token found! Login first.', true);
                return;
            }

            log(`Using token: ${token.substring(0, 50)}...`);

            try {
                const response = await fetch(`${API_URL}/auth/verify`, {
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                });

                log(`Status: ${response.status}`);
                
                if (response.ok) {
                    const data = await response.json();
                    log('✅ Verification successful!');
                    log(`Valid: ${data.valid}`);
                    log(`User: ${data.user.name} (${data.user.role})`);
                } else {
                    const text = await response.text();
                    log(`❌ Verification failed: ${text}`, true);
                }
            } catch (error) {
                log(`❌ Error: ${error.message}`, true);
            }
        }

        function clearAll() {
            localStorage.clear();
            document.getElementById('results').innerHTML = '';
            log('✅ All storage cleared');
        }

        // Auto-check on load
        window.addEventListener('DOMContentLoaded', checkToken);
    </script>
</body>
</html>
