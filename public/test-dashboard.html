<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iconic Smart CRM - Test Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .header {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 30px;
            text-align: center;
        }
        
        .header h1 {
            color: #667eea;
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        .header p {
            color: #666;
            font-size: 1.1em;
        }
        
        .login-section, .dashboard-section {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 20px;
        }
        
        .hidden { display: none; }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
        }
        
        input, select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
            transition: border 0.3s;
        }
        
        input:focus, select:focus {
            outline: none;
            border-color: #667eea;
        }
        
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }
        
        button:hover {
            transform: translateY(-2px);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 25px;
            border-radius: 12px;
            text-align: center;
        }
        
        .stat-card h3 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        .stat-card p {
            opacity: 0.9;
            font-size: 0.9em;
        }
        
        .data-section {
            margin-top: 20px;
        }
        
        .data-section h3 {
            color: #667eea;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #e0e0e0;
        }
        
        .data-grid {
            display: grid;
            gap: 15px;
            margin-bottom: 30px;
        }
        
        .data-card {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            border-left: 4px solid #667eea;
        }
        
        .data-card h4 {
            color: #333;
            margin-bottom: 10px;
        }
        
        .data-card p {
            color: #666;
            margin: 5px 0;
            font-size: 0.95em;
        }
        
        .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 600;
            margin: 5px 5px 5px 0;
        }
        
        .badge-success { background: #d4edda; color: #155724; }
        .badge-warning { background: #fff3cd; color: #856404; }
        .badge-info { background: #d1ecf1; color: #0c5460; }
        .badge-danger { background: #f8d7da; color: #721c24; }
        
        .user-info {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        
        .credentials {
            background: #fff3cd;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            border-left: 4px solid #ffc107;
        }
        
        .credentials h4 {
            color: #856404;
            margin-bottom: 10px;
        }
        
        .credentials code {
            background: white;
            padding: 2px 8px;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🚀 Iconic Smart CRM</h1>
            <p>Test Dashboard - API Explorer</p>
        </div>

        <!-- Login Section -->
        <div id="loginSection" class="login-section">
            <h2 style="margin-bottom: 20px; color: #333;">Login</h2>
            
            <div class="credentials">
                <h4>📝 Demo Credentials</h4>
                <p><strong>Admin:</strong> <code>admin@iconic-crm.com</code> / <code>admin123</code></p>
                <p><strong>Manager:</strong> <code>manager@iconic-crm.com</code> / <code>manager123</code></p>
                <p><strong>Sales:</strong> <code>sales@iconic-crm.com</code> / <code>sales123</code></p>
            </div>
            
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" value="admin@iconic-crm.com">
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" value="admin123">
            </div>
            
            <button onclick="login()">🔐 Login</button>
        </div>

        <!-- Dashboard Section -->
        <div id="dashboardSection" class="dashboard-section hidden">
            <div class="user-info">
                <strong>👤 Logged in as:</strong> <span id="userName"></span> (<span id="userRole"></span>)
                <button onclick="logout()" style="float: right; padding: 8px 15px;">Logout</button>
            </div>

            <div class="stats-grid" id="statsGrid"></div>

            <div class="data-section">
                <h3>📋 Leads</h3>
                <div class="data-grid" id="leadsGrid"></div>
            </div>

            <div class="data-section">
                <h3>💼 Opportunities</h3>
                <div class="data-grid" id="opportunitiesGrid"></div>
            </div>

            <div class="data-section">
                <h3>📇 Contacts</h3>
                <div class="data-grid" id="contactsGrid"></div>
            </div>

            <div class="data-section">
                <h3>📦 Orders</h3>
                <div class="data-grid" id="ordersGrid"></div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:7000/api';
        let authToken = '';

        async function api(endpoint, method = 'GET', data = null) {
            const options = {
                method,
                headers: {
                    'Content-Type': 'application/json'
                }
            };

            if (authToken) {
                options.headers['Authorization'] = `Bearer ${authToken}`;
            }

            if (data) {
                options.body = JSON.stringify(data);
            }

            const response = await fetch(`${API_BASE}${endpoint}`, options);
            return await response.json();
        }

        async function login() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                const result = await api('/auth/login', 'POST', { email, password });
                
                if (result.token) {
                    authToken = result.token;
                    document.getElementById('userName').textContent = result.user.name;
                    document.getElementById('userRole').textContent = result.user.role;
                    
                    document.getElementById('loginSection').classList.add('hidden');
                    document.getElementById('dashboardSection').classList.remove('hidden');
                    
                    loadDashboard();
                } else {
                    alert('Login failed: ' + (result.message || 'Unknown error'));
                }
            } catch (error) {
                alert('Login error: ' + error.message);
            }
        }

        function logout() {
            authToken = '';
            document.getElementById('loginSection').classList.remove('hidden');
            document.getElementById('dashboardSection').classList.add('hidden');
        }

        async function loadDashboard() {
            try {
                const [leads, opportunities, contacts, orders] = await Promise.all([
                    api('/leads'),
                    api('/opportunities'),
                    api('/contacts'),
                    api('/orders')
                ]);

                // Update stats
                document.getElementById('statsGrid').innerHTML = `
                    <div class="stat-card">
                        <h3>${leads.length}</h3>
                        <p>Leads</p>
                    </div>
                    <div class="stat-card">
                        <h3>${opportunities.length}</h3>
                        <p>Opportunities</p>
                    </div>
                    <div class="stat-card">
                        <h3>${contacts.length}</h3>
                        <p>Contacts</p>
                    </div>
                    <div class="stat-card">
                        <h3>${orders.length}</h3>
                        <p>Orders</p>
                    </div>
                `;

                // Display leads
                document.getElementById('leadsGrid').innerHTML = leads.map(lead => `
                    <div class="data-card">
                        <h4>${lead.name}</h4>
                        <p><strong>Email:</strong> ${lead.email}</p>
                        <p><strong>Phone:</strong> ${lead.phone || 'N/A'}</p>
                        <span class="badge badge-${getStatusColor(lead.status)}">${lead.status.toUpperCase()}</span>
                        ${lead.source ? `<span class="badge badge-info">${lead.source}</span>` : ''}
                    </div>
                `).join('');

                // Display opportunities
                document.getElementById('opportunitiesGrid').innerHTML = opportunities.map(opp => `
                    <div class="data-card">
                        <h4>${opp.name}</h4>
                        <p><strong>Value:</strong> $${opp.value?.toLocaleString() || 'N/A'}</p>
                        <p><strong>Stage:</strong> ${opp.stage}</p>
                        <span class="badge badge-${getStageColor(opp.stage)}">${opp.stage.toUpperCase()}</span>
                    </div>
                `).join('');

                // Display contacts
                document.getElementById('contactsGrid').innerHTML = contacts.length > 0 ? contacts.map(contact => `
                    <div class="data-card">
                        <h4>${contact.name}</h4>
                        <p><strong>Email:</strong> ${contact.email}</p>
                        <p><strong>Phone:</strong> ${contact.phone || 'N/A'}</p>
                        ${contact.company ? `<p><strong>Company:</strong> ${contact.company}</p>` : ''}
                    </div>
                `).join('') : '<p>No contacts found</p>';

                // Display orders
                document.getElementById('ordersGrid').innerHTML = orders.length > 0 ? orders.map(order => `
                    <div class="data-card">
                        <h4>Order #${order.orderId || 'N/A'}</h4>
                        <p><strong>Amount:</strong> $${order.amount?.toFixed(2) || 'N/A'}</p>
                        <p><strong>Status:</strong> ${order.orderStatus}</p>
                        <span class="badge badge-${order.paymentStatus === 'paid' ? 'success' : 'warning'}">${order.paymentStatus?.toUpperCase()}</span>
                        <span class="badge badge-${getOrderStatusColor(order.orderStatus)}">${order.orderStatus?.toUpperCase()}</span>
                    </div>
                `).join('') : '<p>No orders found</p>';

            } catch (error) {
                console.error('Dashboard load error:', error);
                alert('Error loading dashboard: ' + error.message);
            }
        }

        function getStatusColor(status) {
            const colors = {
                'new': 'info',
                'contacted': 'warning',
                'qualified': 'success',
                'converted': 'success',
                'lost': 'danger'
            };
            return colors[status] || 'info';
        }

        function getStageColor(stage) {
            const colors = {
                'prospecting': 'info',
                'qualification': 'warning',
                'proposal': 'warning',
                'negotiation': 'warning',
                'closed-won': 'success',
                'closed-lost': 'danger'
            };
            return colors[stage] || 'info';
        }

        function getOrderStatusColor(status) {
            const colors = {
                'pending': 'warning',
                'placed': 'info',
                'processing': 'info',
                'shipped': 'warning',
                'delivered': 'success',
                'completed': 'success',
                'cancelled': 'danger'
            };
            return colors[status] || 'info';
        }
    </script>
</body>
</html>
