<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Charlie's CRM</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 50%, #6366f1 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-container {
            background: white;
            padding: 3.25rem 2.75rem;
            border-radius: 24px;
            box-shadow: 0 25px 60px -10px rgba(15, 23, 42, 0.35);
            max-width: 460px;
            width: 100%;
        }

        .logo {
            text-align: center;
            margin-bottom: 2.25rem;
        }

        .logo-badge {
            width: 76px;
            height: 76px;
            margin: 0 auto 1.1rem;
            background: linear-gradient(135deg, #eef2ff 0%, #e0e7ff 100%);
            border: 2px solid #c7d2fe;
            border-radius: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.75rem;
            box-shadow: 0 12px 25px -5px rgba(79, 70, 229, 0.25);
            transition: transform 0.25s ease;
        }

        .logo-badge:hover {
            transform: scale(1.05) rotate(3deg);
        }

        .brand-title {
            color: #0f172a;
            text-align: center;
            margin-bottom: 0.35rem;
            font-size: 2.25rem;
            font-weight: 800;
            letter-spacing: -0.03em;
            line-height: 1.2;
            display: block;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            margin-bottom: 2rem;
            font-size: 0.95rem;
            font-weight: 500;
            letter-spacing: -0.01em;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            margin-bottom: 0.45rem;
            color: #1e293b;
            font-weight: 600;
            font-size: 0.9rem;
        }

        input {
            width: 100%;
            padding: 0.9rem 1.15rem;
            border: 1.5px solid #cbd5e1;
            border-radius: 12px;
            font-size: 1rem;
            transition: all 0.2s ease;
            font-family: inherit;
            background: #f8fafc;
        }

        input:focus {
            outline: none;
            background: #ffffff;
            border-color: #4f46e5;
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.15);
        }

        input:invalid:not(:placeholder-shown) {
            border-color: #f87171;
        }

        .btn {
            width: 100%;
            padding: 0.95rem;
            background: linear-gradient(135deg, #4f46e5 0%, #4338ca 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.05rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-top: 1.25rem;
            box-shadow: 0 10px 20px -5px rgba(79, 70, 229, 0.4);
            font-family: inherit;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 25px -5px rgba(79, 70, 229, 0.5);
            background: linear-gradient(135deg, #4338ca 0%, #3730a3 100%);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn:focus {
            outline: 3px solid #667eea;
            outline-offset: 2px;
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .demo-credentials {
            background: #edf2f7;
            padding: 1.5rem;
            border-radius: 8px;
            margin: 1.5rem 0;
            font-size: 0.9rem;
        }

        .demo-credentials h3 {
            color: #2d3748;
            margin-bottom: 0.75rem;
            font-size: 1rem;
        }

        .demo-credentials p {
            margin: 0.5rem 0;
            color: #4a5568;
        }

        .demo-credentials code {
            background: white;
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
            color: #667eea;
        }

        .error-message {
            background: #fed7d7;
            color: #c53030;
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            display: none;
            font-size: 0.95rem;
        }

        .error-message.show {
            display: block;
        }

        .success-message {
            background: #c6f6d5;
            color: #2f855a;
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            display: none;
        }

        .success-message.show {
            display: block;
        }

        .loading {
            display: none;
            text-align: center;
            color: #718096;
            margin-top: 1rem;
        }

        .spinner {
            border: 3px solid #f3f4f6;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto 0.5rem;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .help-links {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.9rem;
        }

        .help-links a {
            color: #667eea;
            text-decoration: none;
            margin: 0 0.5rem;
        }

        .help-links a:hover {
            text-decoration: underline;
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 2rem 1.5rem;
            }

            h1 {
                font-size: 1.5rem;
            }
        }

        /* Accessibility */
        :focus-visible {
            outline: 3px solid #667eea;
            outline-offset: 2px;
        }

        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0,0,0,0);
            white-space: nowrap;
            border-width: 0;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo" data-branding="logo-container">
            <div class="logo-badge" data-branding="logo" role="img" aria-label="Rocket icon">🚀</div>
            <h1 class="brand-title" data-branding="heading">Charlie's CRM</h1>
            <p class="subtitle" data-branding="subtitle">Simple, Powerful, Accessible</p>
        </div>

        <div id="errorMessage" class="error-message" role="alert" aria-live="assertive"></div>
        <div id="successMessage" class="success-message" role="alert" aria-live="polite"></div>

        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label for="email">
                    Email Address
                    <span class="sr-only">(required)</span>
                </label>
                <input 
                    type="email" 
                    id="email" 
                    name="email"
                    placeholder="Enter your email"
                    required
                    autocomplete="email"
                    aria-required="true"
                    aria-describedby="email-hint"
                >
                <span id="email-hint" class="sr-only">Enter your registered email address</span>
            </div>

            <div class="form-group">
                <label for="password">
                    Password
                    <span class="sr-only">(required)</span>
                </label>
                <input 
                    type="password" 
                    id="password" 
                    name="password"
                    placeholder="Enter your password"
                    required
                    autocomplete="current-password"
                    aria-required="true"
                    aria-describedby="password-hint"
                >
                <span id="password-hint" class="sr-only">Enter your password</span>
            </div>

            <button type="submit" class="btn" id="loginBtn" aria-label="Login to dashboard">
                🔓 Login
            </button>
        </form>



        <div id="loading" class="loading">
            <div class="spinner" role="status" aria-label="Logging in"></div>
            <p>Logging you in...</p>
        </div>

        <div class="help-links">
            <a href="#" onclick="showHelp(); return false;">Need Help?</a>
            <span>•</span>
            <a href="#" onclick="viewDocs(); return false;">Documentation</a>
        </div>
    </div>

    <script>
        const API_URL = window.location.origin + '/api';

        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.textContent = message;
            errorDiv.classList.add('show');
            setTimeout(() => errorDiv.classList.remove('show'), 5000);
        }

        function showSuccess(message) {
            const successDiv = document.getElementById('successMessage');
            successDiv.textContent = message;
            successDiv.classList.add('show');
        }

        async function handleLogin(event) {
            event.preventDefault();

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const loginBtn = document.getElementById('loginBtn');
            const loading = document.getElementById('loading');

            // Disable button and show loading
            loginBtn.disabled = true;
            loginBtn.textContent = '⏳ Logging in...';
            loading.style.display = 'block';

            try {
                const response = await fetch(`${API_URL}/auth/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (response.ok && data.token) {
                    // Clear any stale cached feature state
                    localStorage.removeItem('cachedEntitlements');
                    sessionStorage.removeItem('cachedEntitlements');
                    sessionStorage.removeItem('suspensionReason');

                    // Store token & fresh user info
                    localStorage.setItem('authToken', data.token);
                    localStorage.setItem('userName', data.user.name);
                    localStorage.setItem('userRole', data.user.role);
                    localStorage.setItem('currentUser', JSON.stringify(data.user));

                    showSuccess('✅ Login successful! Redirecting...');

                    // Redirect to dashboard
                    setTimeout(() => {
                        window.location.href = '/dashboard.html';
                    }, 500);
                } else {
                    throw new Error(data.message || 'Login failed');
                }
            } catch (error) {
                console.error('Login error:', error);
                showError('❌ ' + error.message + '. Please check your credentials and try again.');
                
                // Re-enable button
                loginBtn.disabled = false;
                loginBtn.textContent = '🔓 Login';
                loading.style.display = 'none';
            }
        }

        function showHelp() {
            alert('📞 Contact Support:\n\nEmail: info@bitbloom.in\n\nOr visit our Help Center at /help.html');
        }

        function viewDocs() {
            window.open('/WORKFLOW_GUIDE.md', '_blank');
        }



        // Check if already logged in with verified token
        window.addEventListener('DOMContentLoaded', async () => {
            const token = localStorage.getItem('authToken');
            if (!token) return;

            try {
                const res = await fetch(`${API_URL}/auth/verify`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (res.ok) {
                    const data = await res.json();
                    if (data.valid && data.user) {
                        showSuccess('You are already logged in. Redirecting to workspace...');
                        setTimeout(() => {
                            window.location.href = '/dashboard.html';
                        }, 600);
                        return;
                    }
                }
                // Token invalid or expired: clear without looping
                localStorage.removeItem('authToken');
                localStorage.removeItem('currentUser');
            } catch (err) {
                // If offline or network error, do not loop
                console.warn('Silent auth check notice:', err.message);
            }
        });
    </script>
    <script src="/js/tenant-branding.js"></script>
</body>
</html>
