<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Service Request</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#137fec",
                        "background-light": "#f6f7f8",
                        "background-dark": "#101922",
                    },
                    fontFamily: {
                        "display": ["Inter"]
                    },
                    borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" },
                },
            },
        }
    </script>
<style>
        .form-select {
            background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 20 20'%3e%3cpath stroke='%236b7280' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.5' d='M6 8l4 4 4-4'/%3e%3c/svg%3e");
            background-position: right 0.5rem center;
            background-repeat: no-repeat;
            background-size: 1.5em 1.5em;
            padding-right: 2.5rem;
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
        }
    </style>
</head>
<body class="bg-background-light dark:bg-background-dark font-display text-gray-800 dark:text-gray-200">
<div class="flex flex-col min-h-screen">
<header class="bg-background-light dark:bg-background-dark border-b border-gray-200 dark:border-gray-700/50 shadow-sm">
<div class="container mx-auto px-4 sm:px-6 lg:px-8">
<div class="flex items-center justify-between h-16">
<div class="flex items-center gap-4">
<div class="text-primary">
<svg class="h-8 w-8" fill="none" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
<path d="M4 42.4379C4 42.4379 14.0962 36.0744 24 41.1692C35.0664 46.8624 44 42.2078 44 42.2078L44 7.01134C44 7.01134 35.068 11.6577 24.0031 5.96913C14.0971 0.876274 4 7.27094 4 7.27094L4 42.4379Z" fill="currentColor"></path>
</svg>
</div>
<h1 class="text-xl font-bold text-gray-900 dark:text-white">CRM</h1>
</div>
<nav class="hidden md:flex items-center gap-8">
<a class="text-sm font-medium text-gray-600 dark:text-gray-300 hover:text-primary dark:hover:text-primary transition-colors" href="#">Dashboard</a>
<a class="text-sm font-medium text-gray-600 dark:text-gray-300 hover:text-primary dark:hover:text-primary transition-colors" href="#">Orders</a>
<a class="text-sm font-medium text-primary dark:text-primary" href="#">Services</a>
<a class="text-sm font-medium text-gray-600 dark:text-gray-300 hover:text-primary dark:hover:text-primary transition-colors" href="#">Deliveries</a>
<a class="text-sm font-medium text-gray-600 dark:text-gray-300 hover:text-primary dark:hover:text-primary transition-colors" href="#">Marketing</a>
</nav>
<div class="flex items-center gap-4">
<button class="p-2 rounded-full text-gray-500 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-800 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary">
<span class="material-symbols-outlined">notifications</span>
</button>
<div class="bg-center bg-no-repeat aspect-square bg-cover rounded-full h-10 w-10" style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuBFKiGVJiShXBKiE_edYV_yFtnTkXd7E61l4lEvuRfmXxvoeZDD3oCtXOBP4BZcjk0nYCdFh3iMjFEqwkHlqTvnBc1xTr4HrZ_2W7xFxCbrxoKE2oU2C7Xfhcz1ECTiAygMeJwhHp_hzvWZMCoi0VAs6AlpQB36xhCCAvh0ZnUr3ih14qApI7rsbp6kGKWqqFrgmo026O2vWsSkZT9k_IJr2CfK1eiyYk-XIu8PaoTJqe12VVnRYP7tX4DZAtwPLRhUqxlRDQdzwIA");'></div>
</div>
</div>
</div>
</header>
<main class="flex-grow">
<div class="container mx-auto px-4 sm:px-6 lg:px-8 py-8 md:py-12">
<div class="max-w-xl mx-auto">
<div class="bg-background-light dark:bg-background-dark/50 p-6 sm:p-8 rounded-lg shadow-md border border-gray-200 dark:border-gray-700/50">
<div class="text-center mb-8">
<h2 class="text-2xl md:text-3xl font-bold text-gray-900 dark:text-white">Submit a Service Request</h2>
<p class="mt-2 text-sm text-gray-500 dark:text-gray-400">We're here to help. Please fill out the form below.</p>
</div>
<form class="space-y-6" id="service-form">
<div>
<label class="block text-sm font-medium text-gray-700 dark:text-gray-300" for="issue-type">Issue Type</label>
<select class="form-select mt-1 block w-full rounded-lg border-gray-300 dark:border-gray-600 bg-background-light dark:bg-background-dark shadow-sm focus:border-primary focus:ring-primary sm:text-sm text-gray-900 dark:text-gray-200" id="issue-type" name="issue-type">
<option>Select an issue type</option>
<option value="technical">Technical Issue</option>
<option value="billing">Billing Inquiry</option>
<option value="general">General Question</option>
<option value="feedback">Feedback</option>
</select>
</div>
<div>
<label class="block text-sm font-medium text-gray-700 dark:text-gray-300" for="description">Description</label>
<textarea class="mt-1 block w-full rounded-lg border-gray-300 dark:border-gray-600 bg-background-light dark:bg-background-dark shadow-sm focus:border-primary focus:ring-primary sm:text-sm text-gray-900 dark:text-gray-200" id="description" name="description" placeholder="Please describe your issue in detail..." rows="4"></textarea>
</div>
<div>
<button class="w-full flex justify-center py-3 px-4 border border-transparent rounded-lg shadow-sm text-sm font-medium text-white bg-primary hover:bg-primary/90 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary dark:focus:ring-offset-background-dark" type="submit">
                                    Submit Request
                                </button>
</div>
</form>
<div class="hidden mt-6 text-center p-4 rounded-lg bg-primary/10 dark:bg-primary/20 border border-primary/20 dark:border-primary/30" id="confirmation-message">
<div class="flex items-center justify-center">
<span class="material-symbols-outlined text-primary mr-3 text-2xl">check_circle</span>
<div>
<h3 class="text-sm font-medium text-primary">Request Submitted Successfully!</h3>
<p class="mt-1 text-xs text-gray-600 dark:text-gray-300">Our team will review your request and get back to you within 24 hours.</p>
</div>
</div>
</div>
</div>
</div>
</div>
</main>
</div>
<script>
        document.getElementById('service-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const form = e.target;
            // In a real application, you would handle the form submission here (e.g., via AJAX).
            // For this demo, we'll just hide the form and show the confirmation message.
            form.classList.add('hidden');
            document.getElementById('confirmation-message').classList.remove('hidden');
        });
    </script>

</body></html>
